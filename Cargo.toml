[package]
name = "towing-server"
version = "1.0.0"
edition = "2024"

[features]
default = []

cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda"
]

[dependencies]
axum = "0.8"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

anyhow = "1"

candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

tokenizers = "0.22"
hf-hub = "0.4"
